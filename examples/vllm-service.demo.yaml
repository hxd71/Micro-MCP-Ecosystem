apiVersion: aiops.local/v1alpha1
kind: InferenceService
metadata:
  name: qwen-demo
spec:
  image: vllm/vllm-openai:demo
  model:
    hostPath: demo/models/Qwen2.5-7B-Instruct
    containerPath: /model
  gpu:
    deviceIds: ["0"]
  endpoint:
    bindAddress: 127.0.0.1
    hostPort: 8000
    healthPath: /v1/models
  vllm:
    dtype: auto
    tensorParallelSize: 1
    maxModelLen: 8192
    gpuMemoryUtilization: 0.85
  monitoring:
    intervalSeconds: 60
    failureThreshold: 3
