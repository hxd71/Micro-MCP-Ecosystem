apiVersion: aiops.local/v1alpha1
kind: InferenceService
metadata:
  name: qwen-rtx3050
spec:
  image: modelscope-registry.cn-hangzhou.cr.aliyuncs.com/modelscope-repo/modelscope@sha256:9a896237e77fadf7b59518b31d1608806ed2958144718e9dcb1ca72e49ed2bbc
  model:
    # Keep production models on the Linux filesystem, not a Windows /mnt drive.
    hostPath: /models/Qwen2.5-0.5B-Instruct
    containerPath: /model
  gpu:
    deviceIds: ["0"]
  endpoint:
    bindAddress: 127.0.0.1
    hostPort: 18080
    containerPort: 8000
    healthPath: /v1/models
  vllm:
    launchMode: python-module
    engineVersion: v0
    dtype: half
    tensorParallelSize: 1
    maxModelLen: 512
    gpuMemoryUtilization: 0.90
    enforceEager: true
    maxNumSeqs: 4
    maxNumBatchedTokens: 512
    swapSpaceGiB: 1
    disableFrontendMultiprocessing: true
    servedModelName: qwen2.5-0.5b
  securityContext:
    readOnlyRootFilesystem: true
    noNewPrivileges: true
  monitoring:
    intervalSeconds: 60
    failureThreshold: 3
    startupTimeoutSeconds: 180
