[project]
name = "local-ai-ops-agent"
version = "0.2.0"
description = "Local, approval-gated operations agent for Docker, NVIDIA and vLLM"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.8",
    "docker>=7.1.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "jinja2>=3.1.5",
    "nvidia-ml-py>=12.560.30",
    "psutil>=6.1.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.2",
    "tomli>=2.0.1; python_version < '3.11'",
    "uvicorn>=0.34.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.4.1"]
dev = [
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
]

[project.scripts]
aiops = "aiops_agent.cli:main"
aiops-agent = "aiops_agent.daemon:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiops_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
warn_unused_ignores = true
disable_error_code = ["import-untyped"]
exclude = "^(mcp-|protocals|legacy)"

[[tool.mypy.overrides]]
module = "tomli"
ignore_missing_imports = true
