name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests
      - run: mypy src/aiops_agent
      - run: pytest -q
      - run: pytest -q tests/test_contracts.py
      - run: python -m pip install build
      - run: python -m build

  systemd-acceptance:
    name: native Ubuntu 22.04 systemd
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install, start, stop and recover the daemon
        env:
          SYSTEMD_ACCEPTANCE_LOG: ${{ runner.temp }}/aiops-agent-systemd.log
        run: bash tests/systemd_acceptance.sh
      - name: Upload systemd journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-systemd-journal
          path: ${{ runner.temp }}/aiops-agent-systemd.log
          if-no-files-found: error
